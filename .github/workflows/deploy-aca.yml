name: Deploy Azure Container App

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: rg-containerapp-001
      LOCATION: centralus
      CONTAINER_APP_NAME: hello-world
    steps:
    # ------------------------------------------------------------
    # Checkout
    # ------------------------------------------------------------
    - name: Checkout Code
      uses: actions/checkout@v4
  
    # ------------------------------------------------------------
    # Azure Login using GitHub OIDC
    # ------------------------------------------------------------
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  
    # ------------------------------------------------------------
    # Create Resource Group
    # ------------------------------------------------------------
    - name: Create Resource Group
      run: |
        az group create \
          --name "$RESOURCE_GROUP" \
          --location "$LOCATION"
  
    # ------------------------------------------------------------
    # Validate Bicep Template
    # ------------------------------------------------------------
    - name: Validate Bicep Template
      run: |
        az deployment group validate \
          --resource-group "$RESOURCE_GROUP" \
          --template-file main.bicep \
          --parameters \
            aadClientId="${{ secrets.AAD_CLIENT_ID }}" \
            aadTenantId="${{ secrets.AAD_TENANT_ID }}" \
            aadClientSecret="${{ secrets.AAD_CLIENT_SECRET }}"
  
    # ------------------------------------------------------------
    # What-If Deployment
    # ------------------------------------------------------------
    - name: What If Deployment
      run: |
        az deployment group what-if \
          --resource-group "$RESOURCE_GROUP" \
          --template-file main.bicep \
          --parameters \
            aadClientId="${{ secrets.AAD_CLIENT_ID }}" \
            aadTenantId="${{ secrets.AAD_TENANT_ID }}" \
            aadClientSecret="${{ secrets.AAD_CLIENT_SECRET }}"
  
    # ------------------------------------------------------------
    # Deploy Bicep Template
    # ------------------------------------------------------------
    - name: Deploy Bicep Template
      run: |
        az deployment group create \
          --resource-group "$RESOURCE_GROUP" \
          --template-file main.bicep \
          --parameters \
            aadClientId="${{ secrets.AAD_CLIENT_ID }}" \
            aadTenantId="${{ secrets.AAD_TENANT_ID }}" \
            aadClientSecret="${{ secrets.AAD_CLIENT_SECRET }}"
    
    # ------------------------------------------------------------
    # Get Container App URL
    # ------------------------------------------------------------
    - name: Get Container App URL
      id: appurl
      run: |
        FQDN=$(az containerapp show \
          --name "$CONTAINER_APP_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --query properties.configuration.ingress.fqdn \
          --output tsv)
    
        if [ -z "$FQDN" ]; then
          echo "ERROR: Container App FQDN could not be retrieved."
          exit 1
        fi
    
        APP_URL="https://${FQDN}"
        CALLBACK_URL="${APP_URL}/.auth/login/aad/callback"
    
        echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
        echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
        echo "callback_url=$CALLBACK_URL" >> "$GITHUB_OUTPUT"
    
        echo "Container App URL: $APP_URL"
        echo "Callback URL: $CALLBACK_URL"
    
    # ------------------------------------------------------------
    # Get Existing Entra App Registration
    # ------------------------------------------------------------
    - name: Get Entra App Registration
      id: entra
      run: |
        APP_OBJECT_ID=$(az ad app show \
          --id "${{ secrets.AAD_CLIENT_ID }}" \
          --query id \
          --output tsv)
    
        if [ -z "$APP_OBJECT_ID" ]; then
          echo "ERROR: Entra App Registration not found."
          exit 1
        fi
    
        echo "object_id=$APP_OBJECT_ID" >> "$GITHUB_OUTPUT"
    
        echo "Entra App Registration found."
        echo "Object ID: $APP_OBJECT_ID"
    
    # ------------------------------------------------------------
    # Update Entra Redirect URI
    # ------------------------------------------------------------
    - name: Update Entra Redirect URI
      env:
        CALLBACK_URL: ${{ steps.appurl.outputs.callback_url }}
        APP_OBJECT_ID: ${{ steps.entra.outputs.object_id }}
      run: |
        echo "Checking existing redirect URIs..."
    
        CURRENT_REDIRECTS=$(az rest \
          --method GET \
          --url "https://graph.microsoft.com/v1.0/applications/${APP_OBJECT_ID}" \
          --query "web.redirectUris" \
          --output json)
    
        echo "Current redirect URIs:"
        echo "$CURRENT_REDIRECTS"
    
        UPDATED_REDIRECTS=$(echo "$CURRENT_REDIRECTS" | \
          jq --arg uri "$CALLBACK_URL" \
          '. + [$uri] | unique')
    
        echo "Updated redirect URIs:"
        echo "$UPDATED_REDIRECTS"
    
        BODY=$(jq -n \
          --argjson redirects "$UPDATED_REDIRECTS" \
          '{
            web: {
              redirectUris: $redirects
            }
          }')
    
        az rest \
          --method PATCH \
          --url "https://graph.microsoft.com/v1.0/applications/${APP_OBJECT_ID}" \
          --headers "Content-Type=application/json" \
          --body "$BODY"
    
        echo "Redirect URI updated successfully."
    
    # ------------------------------------------------------------
    # Verify Redirect URI
    # ------------------------------------------------------------
    - name: Verify Entra Redirect URI
      env:
        CALLBACK_URL: ${{ steps.appurl.outputs.callback_url }}
        APP_OBJECT_ID: ${{ steps.entra.outputs.object_id }}
      run: |
        echo "Verifying redirect URI..."
    
        REDIRECT_URIS=$(az rest \
          --method GET \
          --url "https://graph.microsoft.com/v1.0/applications/${APP_OBJECT_ID}" \
          --query "web.redirectUris" \
          --output json)
    
        echo "$REDIRECT_URIS"
    
        if echo "$REDIRECT_URIS" | jq -e \
          --arg uri "$CALLBACK_URL" \
          'index($uri) != null' > /dev/null; then
    
          echo "SUCCESS: Redirect URI exists."
    
        else
    
          echo "ERROR: Redirect URI was not found."
          exit 1
    
        fi
